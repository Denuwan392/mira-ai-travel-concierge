// ============ ROUTER ============
function useRouter() {
  const [route, setRoute] = useState(window.location.hash.slice(1) || '/');
  
  useEffect(() => {
    const handler = () => setRoute(window.location.hash.slice(1) || '/');
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  const navigate = useCallback((path) => {
    window.location.hash = path;
    window.scrollTo(0, 0);
  }, []);

  return { route, navigate };
}

function Button({ children, variant = 'primary', size = 'md', className = '', ...props }) {
  const base = 'inline-flex items-center justify-center font-semibold transition-all duration-150 cursor-pointer select-none';
  const variants = {
    primary: 'bg-brand-orange text-white hover:bg-orange-600 active:bg-orange-700',
    secondary: 'bg-white text-brand-black border border-border hover:border-brand-black',
    ghost: 'text-brand-black hover:bg-gray-100',
    teal: 'bg-brand-teal text-white hover:bg-teal-700',
  };
  const sizes = {
    sm: 'px-4 py-2 text-sm rounded-pill',
    md: 'px-6 py-3 text-sm rounded-pill',
    lg: 'px-8 py-4 text-md rounded-pill',
  };
  return (
    <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>
      {children}
    </button>
  );
}

function Chip({ children, active, onClick, className = '' }) {

  );
}

// ============ MIRA WORKSPACE ============
function MiraWorkspace({ navigate }) {
  const [messages, setMessages] = useState([
    { role: 'assistant', content: "Hello, I'm Mira. What kind of Sri Lankan adventure are you planning?", id: 1 }
  ]);
  const [input, setInput] = useState('');
  const [isTyping, setIsTyping] = useState(false);
  const [workspacePanel, setWorkspacePanel] = useState('welcome');
  const [activeTour, setActiveTour] = useState(null);
  const [travellerConfig, setTravellerConfig] = useState({ adults: 2, children: 0, childAges: [] });
  const [quoteState, setQuoteState] = useState(null);
  const messagesEndRef = useRef(null);
  const msgIdRef = useRef(2);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, isTyping]);

  const addMessage = (role, content, uiComponent = null) => {
    const id = msgIdRef.current++;
    setMessages(prev => [...prev, { role, content, id, uiComponent }]);
    return id;
  };

  const handleSend = (text) => {
    const message = text || input;
    if (!message.trim()) return;
    
    addMessage('user', message);
    setInput('');
    setIsTyping(true);

    // Simulate AI response based on content
    setTimeout(() => {
      setIsTyping(false);
      processMessage(message);
    }, 1200);
  };

  const processMessage = (message) => {
    const lower = message.toLowerCase();
    
    // Day tour request
    if (lower.includes('day tour') || lower.includes('day trip') || lower.includes('sigiriya day')) {
      const tour = TOURS.find(t => t.category === 'Day tour');
      setActiveTour(tour);
      setWorkspacePanel('tour-detail');
      addMessage('assistant', `I found a great day tour for you. Here's what I recommend:`, { type: 'TourCard', tourId: tour.id });
      setTimeout(() => {
        addMessage('assistant', 'Would you like me to check availability and pricing? I just need your travel date and group size.', { type: 'TravellerPicker' });
        setWorkspacePanel('traveller-picker');
      }, 500);
      return;
    }

    // Multi-day / cultural trip
    if (lower.includes('cultural') || lower.includes('multi-day') || lower.includes('7 day') || lower.includes('seven day')) {
      const tour = TOURS.find(t => t.id === 'T09');
      setActiveTour(tour);
      setWorkspacePanel('tour-detail');
      addMessage('assistant', `Based on your interest, I'd recommend our Cultural Triangle package. It covers the ancient cities and sacred sites over 7 days.`, { type: 'TourCard', tourId: tour.id });
      return;
    }

    // Family
    if (lower.includes('family') || lower.includes('children') || lower.includes('kids')) {
      addMessage('assistant', "A family trip to Sri Lanka sounds wonderful. How many adults and children will be travelling, and what are the children's ages? This helps me find the right tours and pricing.");
      setWorkspacePanel('traveller-picker');
      return;
    }

    // Beach / coast
    if (lower.includes('beach') || lower.includes('coast') || lower.includes('mirissa') || lower.includes('galle')) {
      const tour = TOURS.find(t => t.id === 'T08');
      setActiveTour(tour);
      setWorkspacePanel('tour-detail');
      addMessage('assistant', `The southern coast is beautiful. Here's our Galle Coastal Experience — it includes Galle Fort, whale watching in Mirissa and beach time.`, { type: 'TourCard', tourId: tour.id });
      return;
    }

    // Hill country
    if (lower.includes('hill') || lower.includes('ella') || lower.includes('nuwara') || lower.includes('tea')) {
      const tour = TOURS.find(t => t.id === 'T07');
      setActiveTour(tour);
      setWorkspacePanel('tour-detail');
      addMessage('assistant', `The hill country is magical. Our Ella Escape takes you through tea plantations, scenic trails and cool mountain air.`, { type: 'TourCard', tourId: tour.id });
      return;
    }

    // Custom trip
    if (lower.includes('custom') || lower.includes('plan') || lower.includes('create') || lower.includes('itinerary')) {
      addMessage('assistant', "I'd love to help you plan a custom trip. Tell me about your interests — which places you'd like to visit, how many days you have, and your group size. Our team will put together a personalised itinerary with verified pricing.");
      setWorkspacePanel('custom-enquiry');
      return;
    }

    // Quote / pricing
    if (lower.includes('price') || lower.includes('quote') || lower.includes('cost') || lower.includes('how much')) {
      if (activeTour) {
        setQuoteState('checking');
        addMessage('assistant', `Let me check the verified rates for ${activeTour.title}. One moment...`, { type: 'PriceBreakdown' });
        setTimeout(() => {
          setQuoteState('verified');
          setWorkspacePanel('quote');
        }, 1500);
      } else {
        addMessage('assistant', "Which tour would you like a quote for? I can check pricing once I know the tour, travel date and group size.");
      }
      return;
    }

    // Enquiry
    if (lower.includes('enquir') || lower.includes('book') || lower.includes('reserve')) {
      setWorkspacePanel('booking-form');
      addMessage('assistant', "I'll help you send an enquiry. Please fill in your details below and our team will follow up with a confirmed quote.");
      return;
    }

    // Default - discovery
    addMessage('assistant', "I can help you explore Sri Lanka. Are you looking for a day tour, a multi-day journey, or would you like to plan a custom trip?");
    setWorkspacePanel('suggestions');
  };

  const suggestions = [
    { label: 'Find a day tour', icon: Clock },
    { label: 'Explore multi-day trips', icon: Calendar },
    { label: 'Plan a family holiday', icon: Users },
    { label: 'Create a custom trip', icon: Sparkles },
  ];

  return (
    <div className="h-[calc(100vh-64px)] flex flex-col lg:flex-row">
      {/* Left Panel - Conversation */}
      <div className="w-full lg:w-[40%] border-r border-border flex flex-col bg-white">
        {/* Header */}
        <div className="p-4 border-b border-border flex items-center gap-3">
          <div className="w-9 h-9 rounded-full bg-brand-teal/10 flex items-center justify-center">
            <Sparkles className="w-5 h-5 text-brand-teal" />
          </div>
          <div>

            <div className="w-2 h-2 rounded-full bg-brand-leaf animate-pulse" />
            <span className="text-xs text-text-muted">Online</span>
          </div>
        </div>

        {/* Messages */}
        <div className="flex-1 overflow-y-auto custom-scroll p-4 space-y-4">
          {messages.map(msg => (
            <div key={msg.id} className={`flex gap-3 fade-in ${msg.role === 'user' ? 'justify-end' : ''}`}>
              {msg.role === 'assistant' && (
                <div className="w-7 h-7 rounded-full bg-brand-teal/10 flex items-center justify-center flex-shrink-0">
                  <Sparkles className="w-3.5 h-3.5 text-brand-teal" />

              <div className={`max-w-[80%] ${msg.role === 'user' ? 'bg-brand-orange/10 rounded-card rounded-tr-none' : 'bg-gray-50 rounded-card rounded-tl-none'} p-3`}>
                <p className="text-sm leading-relaxed">{msg.content}</p>
                {msg.uiComponent && (
                  <div className="mt-3 pt-3 border-t border-border/50">
                    <UIComponentRenderer type={msg.uiComponent.type} data={msg.uiComponent} navigate={navigate} activeTour={activeTour} setActiveTour={setActiveTour} setWorkspacePanel={setWorkspacePanel} />
                  </div>
                )}
              </div>
              {msg.role === 'user' && (

          {isTyping && (

                </div>

            </div>
          )}
          <div ref={messagesEndRef} />
        </div>

        {/* Suggestions */}
        {messages.length <= 1 && (
          <div className="px-4 pb-2">

            </div>

            />
            <Button variant="primary" onClick={() => handleSend()} disabled={!input.trim()}>

function UIComponentRenderer({ type, data, navigate, activeTour, setActiveTour, setWorkspacePanel }) {
  if (type === 'TourCard' && data.tourId) {
    const tour = TOURS.find(t => t.id === data.tourId);
    if (!tour) return null;
    return (
      <div className="cursor-pointer" onClick={() => { setActiveTour(tour); setWorkspacePanel('tour-detail'); }}>
        <div className="flex items-center gap-3">
          <div className={`w-10 h-10 rounded-lg ${tour.imgClass} flex-shrink-0`} />
          <div>
            <p className="text-xs font-semibold">{tour.title}</p>
            <p className="text-xs text-text-muted">{tour.duration} • {tour.start}</p>
          </div>
        </div>
      </div>
    );
  }
  if (type === 'TravellerPicker') {
    return (
      <div className="text-xs text-brand-teal flex items-center gap-1">
        <Users className="w-3.5 h-3.5" />
        <span>Traveller selector available in workspace →</span>
      </div>
    );
  }
  if (type === 'PriceBreakdown') {
    return (
      <div className="text-xs text-brand-leaf flex items-center gap-1">
        <Check className="w-3.5 h-3.5" />
        <span>Quote calculated — see workspace →</span>
      </div>
    );
  }
  return null;
}

// ============ MAIN APP ============
function App() {
  const { route, navigate } = useRouter();

  const renderPage = () => {
    if (route === '/' || route === '') return <HomePage navigate={navigate} />;
    if (route === '/explore') return <ExplorePage navigate={navigate} />;
    if (route === '/tours') return <ToursPage navigate={navigate} />;
    if (route.startsWith('/tours/')) return <TourDetailPage navigate={navigate} slug={route.replace('/tours/', '')} />;
    if (route === '/destinations') return <DestinationsPage navigate={navigate} />;
    if (route.startsWith('/destinations/')) return <DestinationDetailPage navigate={navigate} slug={route.replace('/destinations/', '')} />;
    if (route === '/mira' || route === '/plan') return <MiraWorkspace navigate={navigate} />;
    if (route === '/about') return <AboutPage />;
    if (route === '/policies') return <PoliciesPage navigate={navigate} />;
    if (route.startsWith('/policies/')) return <PolicyDetailPage navigate={navigate} slug={route.replace('/policies/', '')} />;
    if (route.startsWith('/enquiry/')) return <EnquiryPage navigate={navigate} reference={route.replace('/enquiry/', '')} />;
    if (route === '/staff' || route.startsWith('/staff')) return <StaffPage navigate={navigate} />;
    return (
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24 text-center">
        <h1 className="text-xl font-bold mb-4">Page not found</h1>
        <Button onClick={() => navigate('/')}>Go home</Button>
      </div>
    );
  };

  const showFooter = !route.startsWith('/mira') && !route.startsWith('/plan') && !route.startsWith('/staff');

  return (
    <div className="min-h-screen flex flex-col">
      <Navbar navigate={navigate} route={route} />
      <main className="flex-1">
        {renderPage()}
      </main>
      {showFooter && <Footer navigate={navigate} />}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("Dummy preview error:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="p-8 max-w-xl mx-auto my-12 bg-red-50 border border-red-200 rounded-xl text-red-900 font-sans">
          <h2 className="text-lg font-bold mb-2">Display Error in Dummy Preview</h2>
          <p className="text-sm mb-4">An error occurred while rendering the page components:</p>
          <pre className="text-xs bg-white p-4 rounded border border-red-100 overflow-x-auto">{String(this.state.error?.stack || this.state.error)}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
